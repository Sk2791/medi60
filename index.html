      Object.keys(inv).map(m=>{ const s=stock(pid,m), flag=s.qty===0?'<span class="chip bad">Out of stock</span>':s.exp<3?'<span class="chip bad">Near expiry · blocked</span>':s.qty<5?'<span class="chip warn">Low</span>':'<span class="chip ok">OK</span>';
        return '<tr><td>'+MEDS[m].brand+'</td><td class="small">'+MEDS[m].salt+' '+MEDS[m].strength+'</td><td class="num"><span class="qty"><button data-a="inv-dec" data-med="'+m+'" aria-label="Less">−</button><span>'+s.qty+'</span><button data-a="inv-inc" data-med="'+m+'" aria-label="More">+</button></span></td><td class="mono small">'+s.batch+'</td><td class="small">'+monthLabel(s.exp)+'</td><td>'+flag+'</td><td><button class="btn sm" data-a="inv-oos" data-med="'+m+'">'+(s.qty?'Mark out of stock':'Restock 10')+'</button></td></tr>'; }).join('')+
      '</tbody></table></div><div class="small muted">Items expiring within 3 months are never offered to customers.</div></div>';
  } else if(local.shopTab==='earnings'){
    const del=mineDone.filter(o=>o.result==='delivered'), gross=del.reduce((a,o)=>a+totals(o.items).sub,0), st=S.offerStats[pid]||{accepted:0,missed:0};
    body='<div class="kpis"><div class="card kpi"><span class="small muted">Orders delivered</span><div class="v">'+del.length+'</div></div><div class="card kpi"><span class="small muted">Accepted / missed</span><div class="v">'+st.accepted+' / '+st.missed+'</div></div><div class="card kpi"><span class="small muted">Acceptance score</span><div class="v">'+Math.round(acceptRate(pid)*100)+'%</div><div class="d muted">affects your ranking</div></div><div class="card kpi"><span class="small muted">Payout</span><div class="v">'+rs(gross*0.92)+'</div><div class="d muted">after 8% commission</div></div></div>';
  } else {
    const offerCards=mineOffers.map(o=>{ const off=lastOffer(o), tt=totals(o.items);
      return '<div class="card pad col" style="border:2px solid var(--amber)"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><span class="chip warn">New order · respond now</span><h3 style="font-size:20px;margin-top:6px">'+o.id+' · '+o.items.length+' item'+(o.items.length>1?'s':'')+'</h3><div class="small muted">'+(o.needsRx?'Prescription verified by '+PHARMACIST:'No prescription items')+' · deliver to Lokhandwala'+(o.payMethod==='COD'?' · cash on delivery':'')+(o.slot?' · scheduled '+esc(o.slot):'')+((o.radius||4)>4?' · widened search':'')+'</div></div><div class="timer-ring" data-tick="ring" data-oid="'+o.id+'"><span data-tick="offer" data-oid="'+o.id+'">'+fmt(Math.max(0,3-(simNow(o)-off.at)))+'</span></div></div>'+
        '<table><thead><tr><th>Medicine</th><th class="num">Qty</th><th class="num">Your stock</th></tr></thead><tbody>'+o.items.map(it=>{ const s=stock(pid,it.med); return '<tr><td>'+MEDS[it.med].brand+(it.orig?' <span class="chip acc">approved substitute</span>':'')+'<br><span class="small muted">'+MEDS[it.med].salt+' '+MEDS[it.med].strength+' · min. 3 months shelf life</span></td><td class="num">'+it.qty+'</td><td class="num">'+(s?s.qty:0)+'</td></tr>'; }).join('')+'</tbody></table>'+
        '<div class="row" style="justify-content:space-between"><span class="muted">Your payout</span><b>'+rs(tt.sub*0.92)+'</b></div><div class="row"><button class="btn primary" data-a="p-accept" data-id="'+o.id+'" style="flex:1">Accept order</button><button class="btn" data-a="p-decline" data-id="'+o.id+'">Decline</button></div><div class="small muted">No response in 3 minutes sends the order to the next shop and lowers your ranking.</div></div>'; }).join('');
    const workCards=mineWork.map(o=>{
      if(o.status==='PACKING'){ const all=o.items.every(it=>it.scanned);
        return '<div class="card pad col"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h3>Pick and pack · '+o.id+'</h3><span class="chip acc">'+(o.riderStage==='at_shop'?rider(o.riderId).name+' is at your counter':o.riderId?rider(o.riderId).name+' is on the way':'Finding a rider')+'</span></div><table><thead><tr><th>Medicine</th><th class="num">Qty</th><th>Batch</th><th>Expiry</th><th></th></tr></thead><tbody>'+
          o.items.map((it,i)=>{ const s=stock(pid,it.med); return '<tr><td>'+MEDS[it.med].brand+'</td><td class="num">'+it.qty+'</td><td class="mono small">'+(it.scanned?s.batch:'—')+'</td><td class="small">'+(it.scanned?monthLabel(s.exp):'—')+'</td><td>'+(it.scanned?'<span class="chip ok">Scanned</span>':'<button class="btn sm" data-a="p-scan" data-id="'+o.id+'" data-i="'+i+'">Scan</button>')+'</td></tr>'; }).join('')+
          '</tbody></table><label class="row small"><input type="checkbox" data-seal="'+o.id+'" id="seal-'+o.id+'" '+(all?'':'disabled')+' '+(o.sealed?'checked':'')+'> Packed in a tamper-proof Medi60 bag and sealed'+(all?'':' <span class="muted">(scan every item first)</span>')+'</label><button class="btn primary" data-a="p-ready" data-id="'+o.id+'" '+(all&&o.sealed?'':'disabled')+'>Mark ready for pickup</button>'+(all&&!o.sealed?'<div class="small" style="color:var(--amber)">Seal the bag and tick the box to enable \u201cMark ready\u201d.</div>':'')+'<div class="small muted">Batch and expiry go on the customer’s invoice for traceability and recalls.</div></div>'; }
      if(o.status==='READY_FOR_PICKUP') return '<div class="card pad col"><span class="chip ok" style="align-self:flex-start">Ready</span><h3>'+o.id+' · waiting for rider pickup</h3><div class="small muted">'+(o.riderId?rider(o.riderId).name+' · '+rider(o.riderId).vehicle+' · '+(o.riderStage==='at_shop'?'at your counter':'on the way'):'No rider assigned yet')+'</div><div class="small">Hand over only after the rider scans bag code <span class="mono">'+o.id+'</span>.</div></div>';
      return '<div class="card pad col"><span class="chip ok" style="align-self:flex-start">Handed over</span><h3>'+o.id+' is with the rider</h3></div>';
    }).join('');
    body=(offerCards+workCards)||'<div class="card pad col"><h3>No orders right now</h3><div class="small muted">'+(S.online[pid]?'New orders appear here with a 3-minute timer.':'Your shop is offline, so it receives no orders.')+(p.km>4?' This shop is beyond 4 km, so it gets orders only when Ops widens the search to 8 km.':'')+'</div></div>';
    if(missed.length||mineDone.length) body+='<div class="card pad col"><b>Earlier</b><table><tbody>'+mineDone.slice().reverse().map(o=>'<tr><td class="mono">'+o.id+'</td><td>'+statusChip(o)+'</td></tr>').join('')+missed.filter(o=>o.partnerId!==pid).map(o=>'<tr><td class="mono">'+o.id+'</td><td><span class="chip warn">'+(o.offers.find(x=>x.pid===pid).resp==='timeout'?'Missed':'Declined')+' · went to another shop</span></td></tr>').join('')+'</tbody></table></div>';
  }
  return header('partner')+'<main class="desk col" style="gap:16px"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><h2>'+p.name+'</h2><div class="small muted">'+p.area+' · '+p.km+' km from customer · '+(p.cold?'cold-chain ready':'no cold storage')+'</div></div><div class="row" style="flex-wrap:wrap"><label class="small muted" for="shopSel">Signed in as</label><select id="shopSel" class="sel">'+PARTNERS.map(x=>'<option value="'+x.id+'" '+(x.id===pid?'selected':'')+'>'+x.name+'</option>').join('')+'</select><label class="switch"><input type="checkbox" id="shopOnline" '+(S.online[pid]?'checked':'')+'> '+(S.online[pid]?'Online':'Offline')+'</label></div></div>'+tabs+body+'</main>';
}

/* ===================== Rider app ===================== */
function viewRider(){
  const me=local.rider, r=rider(me), on=S.riderOnline[me];
  const task=S.orders.find(o=>o.riderId===me&&!o.done);
  const mine=S.orders.filter(o=>o.riderId===me&&o.result==='delivered');
  let body='<div class="card pad row" style="justify-content:space-between"><span><b>'+(on?'You are online':'You are offline')+'</b><br><span class="small muted">'+(on?'Andheri W zone':'Go online to receive deliveries')+'</span></span><label class="switch"><input type="checkbox" id="riderOnline" '+(on?'checked':'')+' aria-label="Online"></label></div>';
  if(task){
    const p=partner(task.partnerId); let action='';
    if(task.riderStage==='to_shop') action='<button class="btn primary block" data-a="r-arrive" data-id="'+task.id+'">Arrived at pharmacy</button><div class="small muted" style="text-align:center">Tapping early skips the ride and moves the clock forward.</div>';
    else if(task.status==='PACKING') action='<button class="btn block" disabled>Waiting for the shop to seal the bag</button>';
    else if(task.status==='READY_FOR_PICKUP') action='<button class="btn primary block" data-a="r-pickup" data-id="'+task.id+'">Scan bag and pick up</button>';
    else if(task.status==='OUT_FOR_DELIVERY'&&!task.atDoor) action='<button class="btn primary block" data-a="r-door" data-id="'+task.id+'">Reached customer</button><div class="small muted" style="text-align:center">Tapping early skips the ride and moves the clock forward.</div>';
    else if(task.status==='OUT_FOR_DELIVERY') action='<div class="col" style="gap:8px"><label for="otpIn" class="small"><b>Enter the OTP the customer reads out</b></label><input id="otpIn" data-keep="1" inputmode="numeric" maxlength="4" autocomplete="off" class="otp" style="text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);width:100%"><button class="btn primary block" data-a="r-deliver" data-id="'+task.id+'">Verify OTP and complete</button></div>';
    const leg=(task.riderStage==='to_shop'||task.riderStage==='at_shop')?'Pickup':'Drop';
    body+='<div class="card pad col" style="gap:6px;border-color:var(--accent)"><div class="row" style="justify-content:space-between"><span class="chip acc">Current task · '+leg+'</span><span class="small mono">'+task.id+'</span></div><div><b>Pickup:</b> '+p.name+'<br><span class="small muted">'+p.area+'</span></div><div><b>Drop:</b> '+esc(task.fields?task.fields.patient:CUSTOMER.name)+'<br><span class="small muted">'+CUSTOMER.address+'</span></div><div class="row small" style="flex-wrap:wrap"><span class="chip">Sealed bag</span><span class="chip">OTP on delivery</span>'+(task.payMethod==='COD'?'<span class="chip warn">Collect '+rs(task.amount)+' cash</span>':'')+'<span class="chip">Earn ₹62</span></div></div><div class="map-wrap">'+mapSVG({orders:[task]})+'</div>'+action;
  } else {
    const others=active().filter(o=>o.riderId&&o.riderId!==me);
    if(others.length) body+=others.map(o=>'<div class="sheet col"><b>'+o.id+' went to '+rider(o.riderId).name+'</b><div class="small">The nearest free rider gets each task. Sign in as '+rider(o.riderId).name+' to continue this delivery.</div><button class="btn sm primary" data-a="r-switch" data-r="'+o.riderId+'" style="align-self:flex-start">Sign in as '+rider(o.riderId).name+'</button></div>').join('');
    body+='<div class="map-wrap">'+mapSVG({orders:[],riderIdle:me})+'</div><div class="card pad small muted">'+(on?'No task right now. When a shop accepts an order, the nearest free rider is assigned.':'You won’t get tasks while offline.')+'</div>';
  }
  body+='<div class="card pad"><b>Today</b><div class="small muted">'+mine.length+' deliveries · '+rs(mine.length*62)+' earned · ★ '+r.rating+'</div></div>';
  return header('rider')+'<main class="mobile-col"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2>'+r.name+'</h2><span class="row"><label class="small muted" for="riderSel">Signed in as</label><select id="riderSel" class="sel">'+RIDERS.map(x=>'<option value="'+x.id+'" '+(x.id===me?'selected':'')+'>'+x.name+'</option>').join('')+'</select></span></div><div class="small muted">'+r.vehicle+'</div>'+body+'</main>';
}

/* ===================== Ops control tower ===================== */
function viewOps(){
  const all=S.orders, del=all.filter(o=>o.result==='delivered'), exp=del.filter(o=>!o.slot), within=exp.filter(o=>o.deliveredAt<=60), ver=all.filter(o=>o.verifiedAt!=null), rated=del.filter(o=>o.rating);
  let acc=0, miss=0; Object.values(S.offerStats).forEach(s=>{acc+=s.accepted; miss+=s.missed;});
  const k=(t,v,d)=>'<div class="card kpi"><span class="small muted">'+t+'</span><div class="v">'+v+'</div><div class="d muted">'+d+'</div></div>';
  const kp='<div class="kpis">'+k('Orders',all.length,active().length+' in progress')+k('Delivered ≤ 60 min',exp.length?within.length+' / '+exp.length:'—','express orders · target 90%')+k('Avg delivery',del.length?Math.round(del.reduce((a,o)=>a+o.deliveredAt,0)/del.length)+' min':'—','budget 55 min')+k('Avg Rx decision',ver.length?(ver.reduce((a,o)=>a+o.verifiedAt,0)/ver.length).toFixed(1)+' min':'—','target 7 min')+k('Shop acceptance',acc+miss?Math.round(acc/(acc+miss)*100)+'%':'—',acc+' accepted · '+miss+' missed')+k('Substitutions',all.filter(o=>o.subApplied).length,'all approved by pharmacist')+k('Avg rating',rated.length?(rated.reduce((a,o)=>a+o.rating,0)/rated.length).toFixed(1)+' ★':'—',rated.length+' rated')+'</div>';
  const risky=active().map(o=>({o,why:atRisk(o)})).filter(x=>x.why);
  const riskCard='<div class="card pad col" style="'+(risky.length?'border:2px solid var(--amber)':'')+'"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><b>At-risk orders'+(risky.length?' ('+risky.length+')':'')+'</b><span class="small muted">Orders that may miss the 60-minute promise, with three levers</span></div>'+(risky.length?risky.map(x=>'<div class="col" style="gap:6px;border-top:1px solid var(--line);padding-top:8px"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><span><b class="mono">'+x.o.id+'</b> · '+esc(x.why)+'</span>'+statusChip(x.o)+'</div><div class="row" style="flex-wrap:wrap">'+rescueButtons(x.o)+'</div></div>').join(''):'<div class="small muted">None right now. An order appears here when a step runs over its time budget.</div>')+'</div>';
  if(!local.opsSel||!getOrder(local.opsSel)) local.opsSel=(active()[0]||all[all.length-1]||{}).id||null;
  const sel=local.opsSel?getOrder(local.opsSel):null;
  const orders='<div class="table-wrap"><table><thead><tr><th>Order</th><th>Patient</th><th>Status</th><th>Shop</th><th>Rider</th><th class="num">Time</th></tr></thead><tbody>'+
    (all.length?all.slice().reverse().map(o=>'<tr data-a="ops-sel" data-id="'+o.id+'" style="cursor:pointer;'+(o.id===local.opsSel?'background:var(--accent-soft)':'')+'"><td class="mono">'+o.id+'</td><td>'+esc(o.fields?(o.fields.patient||'—'):CUSTOMER.name)+'</td><td>'+statusChip(o)+'</td><td class="small">'+(o.partnerId?partner(o.partnerId).name:(o.status==='OFFERED_TO_PARTNER'?'<span class="muted">offered: '+partner(lastOffer(o).pid).name+'</span>':'—'))+'</td><td class="small">'+(o.riderId?rider(o.riderId).name:'—')+'</td><td class="num mono">'+(o.slot?'<span class="chip">'+esc(o.slot)+'</span> ':'')+'<span data-tick="elapsed" data-oid="'+o.id+'">'+fmt(simNow(o))+'</span></td></tr>').join(''):'<tr><td colspan="6" class="empty">No orders yet. Place one from the customer app.</td></tr>')+'</tbody></table></div>';
  const ranked=sel&&sel.ranked;
  const table=ranked?'<div class="table-wrap"><table><thead><tr><th>Shop</th><th class="num">km</th><th class="num">Basket /40</th><th class="num">Distance /25</th><th class="num">Accept /15</th><th class="num">Rating /10</th><th class="num">Shelf /10</th><th class="num">Score</th><th>Decision</th></tr></thead><tbody>'+
    ranked.map(r=>{ const p=partner(r.pid), off=sel.offers.find(x=>x.pid===r.pid); const dec=sel.partnerId===r.pid?'<span class="chip ok">Assigned</span>':sel.subPid===r.pid&&sel.status==='SUBSTITUTION_PENDING'?'<span class="chip warn">Best · needs substitute</span>':off&&off.resp==='timeout'?'<span class="chip warn">Timed out</span>':off&&off.resp==='declined'?'<span class="chip warn">Declined</span>':off&&!off.resp?'<span class="chip warn">Offered</span>':r.eligible?'<span class="chip">'+(r.subs&&r.subs.length?'Eligible with substitute':'Eligible')+'</span>':'<span class="chip bad" title="'+esc(r.issues.join('; '))+'">'+esc(r.issues[0]||'')+'</span>';
      return '<tr><td>'+p.name+'</td><td class="num">'+p.km+'</td><td class="num">'+r.b.basket.toFixed(0)+'</td><td class="num">'+r.b.distance.toFixed(1)+'</td><td class="num">'+r.b.accept.toFixed(1)+'</td><td class="num">'+r.b.rating.toFixed(1)+'</td><td class="num">'+r.b.shelf.toFixed(1)+'</td><td class="num"><b>'+(r.eligible?r.total.toFixed(1):'—')+'</b></td><td>'+dec+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="empty">Shown once the matching engine has ranked shops for this order.</div>';
  const network='<table><thead><tr><th>Shop</th><th>Status</th><th class="num">Accept score</th></tr></thead><tbody>'+PARTNERS.map(p=>'<tr><td>'+p.name+'</td><td>'+(p.km>4?'<span class="chip">Beyond 4 km</span>':S.online[p.id]?'<span class="chip ok">Online</span>':'<span class="chip bad">Offline</span>')+'</td><td class="num">'+Math.round(acceptRate(p.id)*100)+'%</td></tr>').join('')+'</tbody></table>';
  const riders='<table><thead><tr><th>Rider</th><th>Status</th></tr></thead><tbody>'+RIDERS.map(r=>{ const t=active().find(o=>o.riderId===r.id); return '<tr><td>'+r.name+'</td><td>'+(t?'<span class="chip acc">On '+t.id+'</span>':S.riderOnline[r.id]?'<span class="chip ok">Free</span>':'<span class="chip">Offline</span>')+'</td></tr>'; }).join('')+'</tbody></table>';
  const sp=S.clock.speed;
  const tools='<div class="card pad col"><span class="eyebrow">Demo clock and data</span><div class="row" style="flex-wrap:wrap"><span class="small muted">Clock speed</span><div class="seg">'+[[1,'Real time'],[10,'10×'],[30,'30×']].map(x=>'<button data-a="speed" data-v="'+x[0]+'" aria-pressed="'+(sp===x[0])+'">'+x[1]+'</button>').join('')+'</div><button class="btn sm" data-a="pause">'+(S.clock.paused?'Resume clock':'Pause clock')+'</button><button class="btn sm danger" data-a="reset">Reset demo data</button></div><div class="small muted">Speed and pause apply to every open app. 10× makes the 3-minute shop timer last 18 seconds.</div></div>';
  const detail=sel?(sel.done?'':'<div class="card pad col"><b>Rescue tools · '+sel.id+'</b><div class="row" style="flex-wrap:wrap">'+(rescueButtons(sel)||'<span class="small muted">No lever applies at this stage.</span>')+'</div><span class="small muted">Search radius now '+(sel.radius||4)+' km'+(sel.slot?' · scheduled '+esc(sel.slot):'')+'</span></div>')+'<div class="card pad col"><div class="row" style="justify-content:space-between"><span class="eyebrow">Journey · '+sel.id+'</span>'+statusChip(sel)+'</div>'+journey(sel)+'</div>'+phaseCard(sel):'';
  return header('ops')+'<main class="desk col" style="gap:16px">'+kp+tools+riskCard+
    '<div class="ops-grid"><div class="col" style="gap:16px"><div class="card pad col"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><b>Live map · Andheri cluster</b><span class="small muted">Amber = offered · green = assigned · grey = offline</span></div><div class="map-wrap">'+mapSVG({labels:true})+'</div></div>'+
    '<div class="card pad col"><b>All orders</b><span class="small muted">Click a row to see its journey and matching decision.</span>'+orders+'</div>'+
    '<div class="card pad col"><b>Matching decision'+(sel?' · '+sel.id:'')+'</b><span class="small muted">Only online shops within the search radius (4 km, or 8 km if widened) that can fill the order are eligible · a same-salt substitute counts only if the doctor permits it · score = basket 40 + distance 25 + acceptance 15 + rating 10 + shelf life 10</span>'+table+'</div></div>'+
    '<div class="col" style="gap:16px">'+detail+'<div class="card pad col"><b>Partner network</b>'+network+'</div><div class="card pad col"><b>Riders</b>'+riders+'</div></div></div></main>';
}
function atRisk(o){
  if(o.done||o.slot) return null; const t=simNow(o), since=t-o.statusAt;
  if(o.status==='PARTIAL_PENDING') return 'Some items are not in stock within '+(o.radius||4)+' km';
  if(o.status==='OFFERED_TO_PARTNER'&&t-lastOffer(o).at>=1.5) return partner(lastOffer(o).pid).name+' is slow to respond';
  if(o.status==='SUBSTITUTION_PENDING'&&since>=4) return 'Substitute decision has been pending over 4 min';
  if(o.status==='RX_UNDER_REVIEW'&&since>=7) return 'Prescription check is over the 7-minute target';
  if(o.status==='RX_QUERY') return 'Waiting for the customer to re-upload';
  if(t+etaMin(o)>55) return 'Projected to take over 55 min';
  return null;
}
function rescueButtons(o){
  const b=[];
  if((o.radius||4)<8&&['PARTIAL_PENDING','MATCHING','OFFERED_TO_PARTNER','SUBSTITUTION_PENDING'].includes(o.status)) b.push('<button class="btn sm" data-a="ops-widen" data-id="'+o.id+'">Widen search to 8 km</button>');
  if(o.status==='OFFERED_TO_PARTNER'&&!lastOffer(o).called) b.push('<button class="btn sm" data-a="ops-call" data-id="'+o.id+'">Call '+partner(lastOffer(o).pid).name+'</button>');
  if(!o.slot&&!o.done) b.push('<button class="btn sm" data-a="ops-slot" data-id="'+o.id+'">Offer a scheduled slot</button>');
  return b.join('');
}
function phaseCard(o){
  const budget=[['Order',3],['Verify + match',7],['Accept',3],['Pack',12],['Ride',30],['Buffer',5]], colors=['#7FA89B','#0A7A62','#C98516','#2F7FA8','#1F8A4E','#A7B4AF'];
  const ticks=[0,3,10,13,25,55,60].map(v=>'<span style="left:'+(v/60*100)+'%">'+v+'</span>').join('');
  const bseg=budget.map((b,i)=>'<div class="seg" style="width:'+(b[1]/60*100)+'%;background:'+colors[i]+'">'+(b[1]>=7?b[0]:'')+'</div>').join('');
  const t=simNow(o), pts=[['Verify',0,o.needsRx?o.verifiedAt:0],['Match + accept',o.needsRx?o.verifiedAt:0,o.acceptedAt],['Pack',o.acceptedAt,o.readyAt],['Pickup',o.readyAt,o.pickedAt],['Ride',o.pickedAt,o.deliveredAt]];
  let segs=''; pts.forEach((p,i)=>{ if(p[1]==null) return; const end=p[2]!=null?p[2]:(o.done?p[1]:t), w=Math.max(0,end-p[1])/60*100; if(w>0) segs+='<div class="seg" style="width:'+w+'%;background:'+colors[i+1]+'" title="'+p[0]+': '+(end-p[1]).toFixed(1)+' min">'+(w>9?p[0]:'')+'</div>'; });
  return '<div class="card pad col"><span class="eyebrow">60-minute budget vs this order (min)</span><div style="position:relative"><div class="phasebar">'+bseg+'</div>'+(o.done?'':'<div class="phase-marker" data-tick="marker" data-oid="'+o.id+'" style="left:'+Math.min(100,t/60*100)+'%"></div>')+'</div><div class="phase-ticks">'+ticks+'</div><div class="phasebar">'+segs+'</div></div>';
}

/* ===================== Render loop ===================== */
function render(){
  const app=local.app;
  const html=!app?viewLanding():!signedIn(app)?viewLogin(app):{customer:viewCustomer,pharmacist:viewPharmacist,partner:viewPartner,rider:viewRider,ops:viewOps}[app]();
  const ae=document.activeElement, id=ae&&ae.id, caret=ae&&ae.selectionStart!=null?ae.selectionStart:null;
  const keep={}; document.querySelectorAll('[data-keep]').forEach(el=>{ if(el.id) keep[el.id]=el.type==='checkbox'?{c:el.checked}:{v:el.value}; });
  document.getElementById('root').innerHTML=html;
  Object.keys(keep).forEach(k=>{ const el=document.getElementById(k); if(!el||el.disabled) return; if('c' in keep[k]) el.checked=keep[k].c; else el.value=keep[k].v; });
  if(id){ const el=document.getElementById(id); if(el&&(el.tagName==='INPUT'||el.tagName==='SELECT')){ el.focus(); if(caret!=null&&el.setSelectionRange&&(el.type==='text'||el.type==='search'||!el.type)){ try{el.setSelectionRange(caret,caret);}catch(e){} } } }
  document.title=app?'Medi60 · '+APPS.find(a=>a.key===app).label+(signedIn(app)?'':' · Sign in'):'Medi60 Prototype';
}
function tickUI(){
  document.querySelectorAll('[data-tick]').forEach(el=>{
    const o=getOrder(el.dataset.oid); if(!o) return; const k=el.dataset.tick, t=simNow(o);
    if(k==='elapsed') el.textContent=fmt(t);
    else if(k==='since') el.textContent=fmt(t-o.statusAt);
    else if(k==='eta') el.textContent='~'+Math.max(1,Math.ceil(etaMin(o)));
    else if(k==='marker') el.style.left=Math.min(100,t/60*100)+'%';
    else if(k==='offer'||k==='ring'){ const off=lastOffer(o); if(!off) return; const rem=3-(t-off.at); if(k==='offer') el.textContent=fmt(Math.max(0,rem)); else el.style.setProperty('--p',Math.max(0,rem/3)); }
  });
  document.querySelectorAll('.rider-dot').forEach(g=>{ const o=getOrder(g.dataset.oid); if(o&&o.riderId){ const p=riderPos(o); g.setAttribute('transform','translate('+p.x+' '+p.y+')'); } });
}
let lastRiskSig='';
function frame(){
  systemTick();
  if(local.app==='ops'){ const sig=active().map(o=>o.id+':'+(atRisk(o)||'')+':'+rescueButtons(o).length).join('|'); if(sig!==lastRiskSig){ lastRiskSig=sig; dirty=true; } }
  if(dirty){ render(); dirty=false; } else tickUI();
}

/* ===================== Events ===================== */
function toast(msg){ if(applyingRemote) return; const h=document.getElementById('toastHost'); if(!h) return; h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toast._t); toast._t=setTimeout(()=>{ h.innerHTML=''; },3200); }
function addToCart(med,qty,conf){ const ex=local.cart.find(c=>c.med===med); if(ex) ex.qty+=qty||1; else local.cart.push({med,qty:qty||1,conf:conf||null}); }
function shrinkImage(file, cb){
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const max=900, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('That file could not be opened as an image. Try a JPG or PNG photo.'); };
  img.src=url;
}
document.addEventListener('click',e=>{
  const pt=e.target.closest('[data-ptab]'); if(pt){ local.shopTab=pt.dataset.ptab; dirty=true; return; }
  const a=e.target.closest('[data-a]'); if(!a) return;
  const act=a.dataset.a, id=a.dataset.id;
  if(act.startsWith('lg-')||act==='signout'){ e.preventDefault(); loginAction(act); dirty=true; return; }
  switch(act){
    case 'c-home': local.custView='home'; local.trackId=null; break;
    case 'c-upload': local.custView='upload'; local.trackId=null; break;
    case 'c-cart': local.custView='cart'; break;
    case 'c-track': local.trackId=id; break;
    case 'c-sample': { const key=a.dataset.key; local.rxAttach={kind:'sample',key}; local.cart=local.cart.filter(c=>!MEDS[c.med].rx); SAMPLES[key].items.forEach(it=>addToCart(it.med,it.qty,it.conf)); local.custView='reading'; setTimeout(()=>{ if(local.custView==='reading'){ local.custView='cart'; dirty=true; } },1600); break; }
    case 'cart-add': addToCart(a.dataset.med,1); toast(MEDS[a.dataset.med].brand+' added to cart'); break;
    case 'cart-inc': local.cart[+a.dataset.i].qty++; break;
    case 'cart-dec': { const c=local.cart[+a.dataset.i]; c.qty--; if(c.qty<=0) local.cart.splice(+a.dataset.i,1); break; }
    case 'c-place': { const c=document.getElementById('consent1'); if(c&&!c.checked){ toast('Please consent to pharmacist review to continue'); return; } if(!local.cart.length) return; const oid=placeOrder(); local.cart=[]; local.rxAttach=null; local.custView='home'; local.trackId=oid; toast('Order '+oid+' placed · payment authorised'); break; }
    case 'c-cancel': doAct('custCancel',local.trackId); break;
    case 'c-subok': doAct('subConsent',local.trackId); break;
    case 'c-subkeep': doAct('custKeep',local.trackId); break;
    case 'c-subrm': doAct('custRemoveSub',local.trackId); break;
    case 'c-reup': doAct('reupload',local.trackId,{rx:{kind:'sample',key:a.dataset.key}}); toast('New prescription sent to the pharmacist'); break;
    case 'c-rate': doAct('rate',id,{v:+a.dataset.v}); break;
    case 'c-reorder': { const o=getOrder(id); if(!o) break; local.cart=[]; o.items.forEach(it=>addToCart(it.med,it.qty)); local.rxAttach=null; local.trackId=null; local.custView='cart';
      toast(o.items.some(it=>MEDS[it.med].rx)?'Items added. Attach a new prescription: each one can be dispensed only once.':'Items added to your cart'); break; }
    case 'c-partial': doAct('partial',local.trackId); break;
    case 'ph-sel': local.pharmSel=id; local.pharmPinned=true; break;
    case 'ph-approve': doAct('approve',id); break;
    case 'ph-reject': doAct('reject',id,Array.from(document.querySelectorAll('.rej:checked')).map(x=>x.value)); break;
    case 'ph-subok': doAct('subApprove',id); break;
    case 'ph-subno': doAct('subReject',id); break;
    case 'ph-ask': { const q=document.getElementById('askQ-'+id); doAct('ask',id,{q:q?q.value:''}); break; }
    case 'ops-widen': doAct('widen',id); break;
    case 'ops-call': doAct('callShop',id); break;
    case 'ops-slot': doAct('toSlot',id,{slot:'Today 6–8 pm'}); break;
    case 'p-accept': doAct('accept',id,{shop:local.shop}); break;
    case 'p-decline': doAct('decline',id,{shop:local.shop}); break;
    case 'p-scan': doAct('scan',id,{i:+a.dataset.i,shop:local.shop}); break;
    case 'p-ready': doAct('ready',id,{shop:local.shop}); break;
    case 'inv-inc': exec('inv',{shop:local.shop,med:a.dataset.med,op:'inc'}); break;
    case 'inv-dec': exec('inv',{shop:local.shop,med:a.dataset.med,op:'dec'}); break;
    case 'inv-oos': exec('inv',{shop:local.shop,med:a.dataset.med,op:'oos'}); toast(MEDS[a.dataset.med].brand+' updated at '+partner(local.shop).name); break;
    case 'r-arrive': doAct('arrive',id,{manual:true,rider:local.rider}); break;
    case 'r-pickup': doAct('pickup',id,{rider:local.rider}); break;
    case 'r-door': doAct('door',id,{manual:true,rider:local.rider}); break;
    case 'r-deliver': doAct('deliver',id,{code:((document.getElementById('otpIn')||{}).value||'').trim(),rider:local.rider,newOtp:String(1000+Math.floor(Math.random()*9000))}); break;
    case 'ops-sel': local.opsSel=id; break;
    case 'r-switch': local.rider=a.dataset.r; break;
    case 'speed': exec('speed',{v:+a.dataset.v,at:Date.now()}); break;
    case 'pause': exec('pause',{v:!S.clock.paused,at:Date.now()}); break;
    case 'reset': exec('reset'); local.trackId=null; local.pharmSel=null; local.opsSel=null; toast('Demo data reset in every open app'); break;
    case 'noop': toast('Not part of this prototype'); break;
  }
  dirty=true;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='search'){ local.search=t.value; const box=document.getElementById('results'); if(box) box.innerHTML=(local.custView!=='cart'&&!t.value)?'':catalogue(t.value); return; }
  if(t.dataset&&t.dataset.field){ const oid=t.dataset.id, key=t.dataset.field, val=t.type==='checkbox'?t.checked:t.value;
    execField({id:oid,key,val}); dirty=false;
    const box=document.getElementById('pharmChecks'), o=getOrder(oid); if(box&&o) box.innerHTML=pharmChecks(o); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='appSwitch'){ location.hash=t.value?'#'+t.value:'#home'; return; }
  if(t.dataset&&t.dataset.seal){ doAct('seal',t.dataset.seal,{shop:local.shop,val:t.checked}); return; }
  if(t.id==='allowSub'){ local.allowSub=t.checked; return; }
  if(t.id==='slotSel'){ local.slot=t.value; dirty=true; return; }
  if(t.id==='paySel'){ local.pay=t.value; dirty=true; return; }
  if(t.id==='reupFile'&&t.files&&t.files[0]){ const f=t.files[0], oid=local.trackId; shrinkImage(f, data=>{ doAct('reupload',oid,{rx:{kind:'upload',data,name:f.name,size:f.size}}); toast('New prescription photo sent to the pharmacist'); dirty=true; }); return; }
  if(t.id==='shopSel'){ local.shop=t.value; dirty=true; }
  else if(t.id==='riderSel'){ local.rider=t.value; dirty=true; }
  else if(t.id==='shopOnline'){ exec('shopOnline',{shop:local.shop,v:t.checked}); toast(partner(local.shop).name+' is now '+(t.checked?'online':'offline')); }
  else if(t.id==='riderOnline'){ if(!t.checked&&active().some(o=>o.riderId===local.rider)){ t.checked=true; toast('Finish the current delivery before going offline'); return; } exec('riderOnline',{rider:local.rider,v:t.checked}); }
  else if(t.dataset&&t.dataset.field&&t.tagName==='SELECT'){ const oid=t.dataset.id; execField({id:oid,key:t.dataset.field,val:t.value}); dirty=false; const box=document.getElementById('pharmChecks'), o=getOrder(oid); if(box&&o) box.innerHTML=pharmChecks(o); }
  else if(t.id==='rxFile'&&t.files&&t.files[0]){ const f=t.files[0]; shrinkImage(f, data=>{ local.rxAttach={kind:'upload',data,name:f.name,size:f.size}; local.custView='cart'; toast('Prescription photo attached'); dirty=true; }); }
});
document.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const t=e.target; if(!t||!/^lg(Phone|Otp|User|Pass)$/.test(t.id||'')) return; e.preventDefault(); const b=document.querySelector('.lg-card [data-primary]'); if(b) b.click(); });
window.addEventListener('hashchange',()=>{ readHash(); resetLogin(); window.scrollTo({top:0}); dirty=true; });
frame(); setInterval(frame,200);
})();

</script>
