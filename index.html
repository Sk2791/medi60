<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medi60 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a demo control bar on top, the active role's app in the centre stage, and a live "order journey" rail on the right that follows one order through all five roles. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#F7FAF8; --ink:#10221C; --muted:#5A6B65; --line:#D9E2DE;
  --accent:#0A7A62; --accent-ink:#FFFFFF; --accent-soft:#DFF0EA;
  --amber:#B87512; --amber-soft:#FBEFD9; --red:#BE3B33; --red-soft:#F8E1DF; --green:#1F8A4E; --green-soft:#DDF2E5;
  --paper:#FFFDF5; --paper-ink:#1D2A4A; --paper-line:#E7E1CC; --hand:#1E3A8A;
  --sea:#D7E8EE; --land:#EEF2EE; --road:#FFFFFF; --road-edge:#D2DAD6;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --script:'Caveat', 'Segoe Print', cursive;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,34,28,.06), 0 6px 24px rgba(16,34,28,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1512; --surface:#13201B; --surface-2:#172620; --ink:#E4EEEA; --muted:#93A69F; --line:#25362F;
    --accent:#35C29E; --accent-ink:#06231B; --accent-soft:#12372D;
    --amber:#E5A440; --amber-soft:#3A2B11; --red:#EF6A61; --red-soft:#3C1B19; --green:#4FC584; --green-soft:#133524;
    --sea:#12303A; --land:#182822; --road:#22362F; --road-edge:#2C4239;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#13201B; --surface-2:#172620; --ink:#E4EEEA; --muted:#93A69F; --line:#25362F;
  --accent:#35C29E; --accent-ink:#06231B; --accent-soft:#12372D;
  --amber:#E5A440; --amber-soft:#3A2B11; --red:#EF6A61; --red-soft:#3C1B19; --green:#4FC584; --green-soft:#133524;
  --sea:#12303A; --land:#182822; --road:#22362F; --road-edge:#2C4239;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:max-content}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.brand h1{font-size:20px;line-height:1}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.roles{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.role-tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--muted);position:relative;display:flex;align-items:center;gap:6px}
.role-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.role-tab .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.sla-pill{margin-left:auto;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.sla-pill .big{font-family:var(--mono);font-size:16px;font-weight:600}
.sla-pill.good{border-color:var(--green);background:var(--green-soft)}
.sla-pill.warn{border-color:var(--amber);background:var(--amber-soft)}
.sla-pill.bad{border-color:var(--red);background:var(--red-soft)}
.demo-row{display:flex;align-items:center;gap:12px;padding:8px 20px;border-top:1px dashed var(--line);background:var(--surface-2);flex-wrap:wrap;font-size:13px}
.demo-row label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.demo-row select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}
.demo-tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .05s, background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Main layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:1100px){.main{grid-template-columns:1fr}}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stage-head h2{font-size:22px}
.stage-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:16px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip.ok{color:var(--green);border-color:transparent;background:var(--green-soft)}
.chip.warn{color:var(--amber);border-color:transparent;background:var(--amber-soft)}
.chip.bad{color:var(--red);border-color:transparent;background:var(--red-soft)}
.chip.acc{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Device frames */
.devices{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.phone{width:375px;max-width:100%;height:740px;border-radius:38px;border:10px solid #1a2421;background:var(--bg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.phone-status{display:flex;justify-content:space-between;padding:8px 18px 4px;font-size:12px;font-weight:600;background:var(--surface)}
.phone-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.app-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.app-bar b{font-family:var(--display);font-size:17px}
.tablet{width:820px;max-width:100%;min-height:600px;border-radius:24px;border:10px solid #1a2421;background:var(--bg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.side-notes{flex:1;min-width:240px;max-width:420px;display:flex;flex-direction:column;gap:12px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.note b{display:block;font-family:var(--display);font-size:14.5px;margin-bottom:2px}
.note p{margin:0;color:var(--muted)}

/* Prescription paper: the signature element */
.rx-paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;padding:18px 18px 14px;position:relative;box-shadow:0 2px 0 var(--paper-line),0 10px 30px rgba(29,42,74,.08);overflow:hidden;background-image:repeating-linear-gradient(transparent 0 27px, rgba(29,42,74,.05) 27px 28px)}
.rx-head{border-bottom:2px solid var(--paper-ink);padding-bottom:8px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.rx-doc{font-family:var(--display);font-size:18px;font-weight:700}
.rx-qual,.rx-clinic{font-size:11.5px;opacity:.8}
.rx-reg{font-family:var(--mono);font-size:11.5px}
.rx-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.hand{font-family:var(--script);color:var(--hand);font-size:21px;line-height:1.1}
.rx-symbol{font-family:Georgia, 'Times New Roman', serif;font-size:34px;font-weight:700;line-height:1;margin:4px 0}
.rx-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rx-sign{display:flex;justify-content:flex-end;margin-top:6px}
.ai-field{position:relative;border-radius:4px;transition:box-shadow .2s}
.show-ai .ai-field{box-shadow:0 0 0 2px var(--accent)}
.show-ai .ai-field.missing{box-shadow:0 0 0 2px var(--red);background:var(--red-soft)}
.show-ai .ai-field::after{content:attr(data-tag);position:absolute;right:-2px;top:-9px;font:600 9.5px/1 var(--mono);background:var(--accent);color:var(--accent-ink);padding:2px 4px;border-radius:3px;white-space:nowrap}
.show-ai .ai-field.missing::after{background:var(--red);color:#fff}
.scanning .rx-paper::before{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(transparent, rgba(10,122,98,.28), transparent);animation:scan 1.5s ease-in-out infinite;z-index:2}
@keyframes scan{to{top:100%}}

/* Journey rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:120px;align-self:start}
@media (max-width:1100px){.rail{position:static}}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.journey li{display:grid;grid-template-columns:52px 16px 1fr;gap:8px;padding:5px 0;align-items:start}
.journey .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding-top:1px}
.journey .node{width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.journey .node.sys{background:var(--muted);box-shadow:0 0 0 3px var(--line)}
.journey .node.warn{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.journey .node.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.journey .node.next{background:transparent;border:2px dashed var(--line);box-shadow:none}
.journey .what{font-weight:500}
.journey .who{font-size:11.5px;color:var(--muted)}
.journey li.upcoming .what{color:var(--muted);font-weight:400}
.phasebar{position:relative;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.phasebar .seg{height:100%;border-right:1px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono);color:var(--accent-ink);overflow:hidden;white-space:nowrap}
.phase-ticks{position:relative;height:16px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.phase-ticks span{position:absolute;transform:translateX(-50%)}
.phase-marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);transition:left .2s linear}
.waiting{border:1px dashed var(--amber);background:var(--amber-soft);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:11.5px;letter-spacing:.02em;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num, th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:12px 14px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;margin-top:2px}
.kpi .d{font-size:11.5px}

/* Misc */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.item .name{font-weight:600}
.timer-ring{--p:1;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p)*360deg), var(--line) 0);display:grid;place-items:center;flex-shrink:0}
.timer-ring span{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:15px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.sheet{border:2px solid var(--amber);background:var(--surface);border-radius:14px;padding:14px}
.otp{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.3em}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:minmax(220px,260px) minmax(300px,1fr) minmax(280px,340px);gap:16px}
@media (max-width:1250px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.grid-3{grid-template-columns:1fr}}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--surface)}
.map-wrap svg{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
.steps-mini{display:flex;flex-direction:column;gap:10px}
.steps-mini div{display:flex;align-items:center;gap:10px}
.steps-mini i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;border:2px solid var(--line);color:var(--muted);flex-shrink:0}
.steps-mini .done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps-mini .now i{border-color:var(--accent);color:var(--accent)}
.steps-mini .now span{font-weight:600}
.footer{max-width:1500px;margin:0 auto;padding:0 20px 24px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select,.search-input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font-size:13.5px;width:100%}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.qty button{border:0;background:transparent;width:28px;height:28px;font-size:15px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.rx-img{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tips li{color:var(--muted)}
.tips b{color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:20px}

#root{min-height:100%}
.desk{max-width:1440px;margin:0 auto;padding:20px;width:100%}
.mobile-col{max-width:460px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:12px;width:100%}
.mobile-col h2{font-size:22px}
.desk h2{font-size:24px}
.sel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink)}
.flow{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.flow-step{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:150px;flex:1}
.flow-arrow{align-self:center;color:var(--muted);font-size:20px}
.app-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.app-card{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color .15s, box-shadow .15s}
.app-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.app-card h3{font-size:19px}
.ops-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.ops-grid{grid-template-columns:1fr}}
.topbar{position:sticky;top:0}
.top-row h1{font-size:19px}
@media (max-width:520px){.top-row{padding:10px 14px}.brand p{display:none}}
.lg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lg-card{width:100%;max-width:420px;padding:28px;display:flex;flex-direction:column;gap:14px}
.lg-phone{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.lg-phone span{padding:7px 10px;border-right:1px solid var(--line);color:var(--ink);font-size:13.5px;background:var(--surface-2)}
.lg-phone input{border:0!important;border-radius:0!important}
.lg-sms{display:flex;flex-direction:column;gap:4px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink)}
.lg-demo{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.lg-err{color:var(--red);font-size:12.5px;margin:0}
.lg-card a{color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<p class="footer">Prototype for a class presentation. Pharmacies, people, stock and prices are illustrative. Payments, rider dispatch and stock sync are simulated in your browser; open apps sync with each other through a shared cloud database.</p>
<div id="toastHost"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="db-shim.js"></script>
<script>
(function(){
'use strict';

/* ===================== Static data ===================== */
const MEDS = {
  glycomet:{brand:'Glycomet 500 SR', salt:'Metformin', strength:'500 mg', form:'Tablet', pack:'Strip of 10', mrp:22, rx:true},
  amlokind:{brand:'Amlokind 5', salt:'Amlodipine', strength:'5 mg', form:'Tablet', pack:'Strip of 15', mrp:28, rx:true},
  pan40:{brand:'Pan 40', salt:'Pantoprazole', strength:'40 mg', form:'Tablet', pack:'Strip of 15', mrp:155, rx:true},
  telma40:{brand:'Telma 40', salt:'Telmisartan', strength:'40 mg', form:'Tablet', pack:'Strip of 15', mrp:240, rx:true},
  telmiGen:{brand:'Telmisartan 40 (generic)', salt:'Telmisartan', strength:'40 mg', form:'Tablet', pack:'Strip of 15', mrp:96, rx:true},
  atorva10:{brand:'Atorva 10', salt:'Atorvastatin', strength:'10 mg', form:'Tablet', pack:'Strip of 15', mrp:118, rx:true},
  azithral:{brand:'Azithral 500', salt:'Azithromycin', strength:'500 mg', form:'Tablet', pack:'Strip of 5', mrp:119, rx:true},
  dolo:{brand:'Dolo 650', salt:'Paracetamol', strength:'650 mg', form:'Tablet', pack:'Strip of 15', mrp:34, rx:false},

/* ===================== Shared store ===================== */
/* Two ways to share one live order between the apps:
   - 'db': the artifact's cloud database. Works across devices. One open app (the "leader", chosen by a
     lease) is the only writer; every other app sends its button presses as commands, which the leader applies.
   - 'ls': browser localStorage. Fallback when the database is not available; syncs tabs on one computer only. */
const KEY='medi60-live-v2', TABS_KEY='medi60-tabs-v2';
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function freshStore(epoch){ return {orders:[], inv:clone(INV_BASE), online:{P1:true,P2:true,P3:true,P4:true,P5:true,P6:true}, riderOnline:{R1:true,R2:true,R3:false}, offerStats:{}, usedRx:{}, clock:{speed:10,paused:false}, seq:0, counter:0, epoch:epoch||1, acks:{}}; }
let canLS=true;
function loadStore(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ canLS=false; return null; } }
let mode=(window.claude&&typeof window.claude.use==='function')?'pending':'ls';
let S=(mode==='ls'?loadStore():null)||freshStore();
let dirty=true, applyingRemote=false;
function persist(){
  S.seq++;
  if(mode!=='ls') return;
  if(canLS){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ canLS=false; toast('Browser storage is full or blocked, so tabs stop syncing. Use the app switcher in one tab.'); } }
}
function mutate(fn, quiet){
  if(mode==='db'){ const r=fn(); if(isLeader) flushDiff(); if(!quiet) dirty=true; return r; }
  const f=loadStore(); if(f) S=f; const r=fn(); persist(); if(!quiet) dirty=true; return r;
}
window.addEventListener('storage', e=>{
  if(mode!=='ls'||e.key!==KEY) return;
  const prev=S; S=e.newValue?JSON.parse(e.newValue):freshStore();
  notifyChanges(prev,S); dirty=true;
});
const TAB=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let isLeader=(mode==='ls'), tabCount=1;
// localStorage mode: one visible tab ("leader") runs the system timers so they fire exactly once.
function heartbeat(){
  if(mode!=='ls') return;
  if(!canLS){ isLeader=true; return; }
  try{ const h=JSON.parse(localStorage.getItem(TABS_KEY)||'{}'); const now=Date.now(); h[TAB]={t:now,v:!document.hidden};
    Object.keys(h).forEach(k=>{ const e=h[k]; const t=typeof e==='number'?e:(e&&e.t)||0; if(now-t>4000) delete h[k]; });
    localStorage.setItem(TABS_KEY, JSON.stringify(h));
    const ids=Object.keys(h).sort(); const vis=ids.filter(k=>h[k]&&h[k].v);
    isLeader=(vis.length?vis[0]:ids[0])===TAB;
    const n=ids.length; if(n!==tabCount){ tabCount=n; updateSyncChip(); } }
  catch(e){ isLeader=true; }
}
heartbeat(); setInterval(heartbeat,1000);
document.addEventListener('visibilitychange',()=>{ heartbeat(); if(mode==='db'&&document.hidden&&isLeader){ isLeader=false; updateSyncChip(); } else if(mode==='db'&&!document.hidden) leaseLoop(); dirty=true; });

/* ---------- Cloud database mode ---------- */
let DB=null, metaLoaded=false, ordersLoaded=false, remoteOrders=[], remoteMeta=null, cmdDocs=[], dbNote='';
const pendingMine=[]; // this app's commands the leader has not confirmed yet
const known={}, wq={}, doneCmds=new Set(), optimistic={};
function syncLabel(){
  if(mode==='db') return metaLoaded&&ordersLoaded?(dbNote?['warn',dbNote]:['ok','Cloud sync on · works across devices']):['acc','Connecting to the live database…'];
  if(mode==='pending') return ['acc','Connecting…'];
  return canLS?['ok','Live sync on'+(tabCount>1?' · '+tabCount+' tabs open':'')+' · this computer only']:['warn','Single-tab mode'];
}
function updateSyncChip(){ const el=document.getElementById('syncChip'); if(!el) return; const l=syncLabel(); el.className='chip '+l[0]; el.textContent=l[1]; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function dbError(e){
  const c=e&&e.code;
  if(c==='quota_exceeded') toast('The live database is full. Reset demo data in Ops to clear old orders.');
  else if(c==='invalid_argument'||c==='not_granted'){ dbNote='View-only access: ask the owner for Contributor access to place orders'; updateSyncChip(); }
  else if(c==='revoked'){ dbNote='Access to the live database was withdrawn'; updateSyncChip(); }
}
function metaOf(st){ const m={}; Object.keys(st).forEach(k=>{ if(k!=='orders') m[k]=st[k]; }); return m; }
function queueWrite(path,data,del){ const q=wq[path]||(wq[path]={busy:false,next:null}); q.next={data:data?clone(data):null,del:!!del,tries:0}; if(!q.busy) pump(path); }
async function pump(path){
  const q=wq[path]; q.busy=true;
  while(q.next){ const job=q.next; q.next=null;
    try{ const ref=DB.doc(path); if(job.del) await ref.delete(); else await ref.set(job.data); }
    catch(e){ dbError(e); if((!e||e.code==='unavailable'||!e.code)&&job.tries<3&&!q.next){ job.tries++; await sleep(300+Math.random()*500); q.next=job; } } }
  q.busy=false;
}
// Leader only: write every document that changed since it was last written or seen.
function flushDiff(){
  if(mode!=='db'||!isLeader) return;
  const m=metaOf(S), mj=JSON.stringify(m);
  if(known.meta!==mj){ known.meta=mj; queueWrite('medi60/meta',m); }
  S.orders.forEach(o=>{ if(o.epoch==null) o.epoch=S.epoch; const j=JSON.stringify(o); if(known['o:'+o.id]!==j){ known['o:'+o.id]=j; queueWrite('orders/'+o.id,o); } });
}
let cmdSeq=0;
function sendCmd(name,p){ cmdSeq++; const id=TAB+'-'+cmdSeq; pendingMine.push({n:cmdSeq,name,p:clone(p||{}),at:Date.now()}); DB.doc('cmds/'+id).set({name, p:clone(p||{}), from:TAB, ts:Date.now(), n:cmdSeq}).catch(e=>{ dbError(e); toast('Could not reach the live database. Try again.'); }); }
// Apply a command coming from another app (leader only), then write the changes.
function applyRemote(name,p,from,n){
  if(!CMD[name]) return;
  const prev=clone(S); applyingRemote=true;
  try{ CMD[name](p||{}); }catch(e){ console.error(e); } finally{ applyingRemote=false; }
  S.acks=S.acks||{}; if(from) S.acks[from]=Math.max(S.acks[from]||0,n||0);
  flushDiff(); notifyChanges(prev,S); dirty=true;
}
// Followers: rebuild the state from the database, then re-apply this app's own unconfirmed clicks on top,
// so a click never appears to undo itself while the leader is still processing it.
function rebuildFromRemote(){
  const prev=clone(S), base=remoteMeta?clone(remoteMeta):metaOf(freshStore()), ep=base.epoch||1;
  base.orders=remoteOrders.filter(o=>(o.epoch||1)>=ep).map(clone).sort((a,b)=>(a.createdMs||0)-(b.createdMs||0));
  if(!base.acks) base.acks={};
  S=base;
  const acked=S.acks[TAB]||0, now=Date.now();
  for(let i=pendingMine.length-1;i>=0;i--){ const c=pendingMine[i]; if(c.n<=acked||now-c.at>60000) pendingMine.splice(i,1); }
  applyingRemote=true; try{ pendingMine.forEach(c=>{ try{ CMD[c.name](clone(c.p)); }catch(e){} }); } finally{ applyingRemote=false; }
  notifyChanges(prev,S); dirty=true;
}
function processCmds(){
  if(mode!=='db'||!isLeader||!metaLoaded||!ordersLoaded) return;
  const list=cmdDocs.filter(d=>!doneCmds.has(d.id)).sort((a,b)=>(a.data.ts-b.data.ts)||(a.data.n-b.data.n));
  list.forEach(d=>{ doneCmds.add(d.id); const c=d.data; if(c.from!==TAB&&Date.now()-(c.ts||0)<600000) applyRemote(c.name,c.p,c.from,c.n); queueWrite('cmds/'+d.id,null,true); });
}
// Run a named command: directly in localStorage mode or on the leader; otherwise apply it locally at once and send it to the leader.
function exec(name,p){
  if(mode!=='db') return mutate(()=>CMD[name](p||{}));
  if(isLeader){ const r=CMD[name](p||{}); flushDiff(); dirty=true; return r; }
  const r=CMD[name](p||{}); dirty=true; sendCmd(name,p); return r;
}
function execField(p){ return exec('field',p); }
function onMeta(snap){
  if(!snap.metadata.fromCache) metaLoaded=true;
  if(!(isLeader&&ordersLoaded&&metaLoaded&&known.meta)){
    remoteMeta=snap.exists?clone(snap.data()):null; known.meta=remoteMeta?JSON.stringify(remoteMeta):'';
    rebuildFromRemote();
  }
  updateSyncChip(); leaseLoop();
}
function onOrders(snap){
  if(!snap.metadata.fromCache) ordersLoaded=true;
  remoteOrders=snap.docs.map(d=>clone(d.data()));
  const ep=(isLeader?S.epoch:(remoteMeta&&remoteMeta.epoch))||1;
  if(isLeader){ remoteOrders.filter(o=>(o.epoch||1)<ep).forEach(o=>{ if(!known['del:'+o.id]){ known['del:'+o.id]=1; queueWrite('orders/'+o.id,null,true); } }); updateSyncChip(); return; }
  remoteOrders.forEach(o=>{ known['o:'+o.id]=JSON.stringify(o); });
  rebuildFromRemote(); updateSyncChip(); leaseLoop();
}
function onCmds(snap){ cmdDocs=snap.docs.map(d=>({id:d.id,data:d.data()})); processCmds(); }
let leaseBusy=false;
async function leaseLoop(){
  if(mode!=='db'||leaseBusy||!metaLoaded||!ordersLoaded) return;
  if(document.hidden){ if(isLeader){ isLeader=false; updateSyncChip(); } return; }
  leaseBusy=true;
  try{ const r=await DB.doc('medi60/leader').acquire({holder:TAB, ttlMs:7000}); const was=isLeader; isLeader=!!r.acquired;
    if(isLeader&&!was){ rebuildFromRemote(); pendingMine.length=0; flushDiff(); processCmds(); dirty=true; }
    if(was!==isLeader) updateSyncChip(); }
  catch(e){ dbError(e); }
  finally{ leaseBusy=false; }
}
function startDb(db){
  DB=db; mode='db'; isLeader=false; S=freshStore(); dirty=true; updateSyncChip();
  const t=setTimeout(()=>{ if(!metaLoaded||!ordersLoaded){ dbNote='The live database can’t be reached yet'; updateSyncChip(); } },10000);
  const ok=()=>{ if(metaLoaded&&ordersLoaded){ clearTimeout(t); if(dbNote==='The live database can’t be reached yet'){ dbNote=''; updateSyncChip(); } } };
  db.doc('medi60/meta').onSnapshot(s=>{ onMeta(s); ok(); }, e=>{ dbError(e); });
  db.collection('orders').onSnapshot(s=>{ onOrders(s); ok(); }, e=>{ dbError(e); });
  db.collection('cmds').onSnapshot(onCmds, e=>{ dbError(e); });
  setInterval(leaseLoop,2500);
}
if(mode==='pending'){
  window.claude.use('db').then(db=>{ if(db) startDb(db); else { mode='ls'; S=loadStore()||freshStore(); isLeader=true; heartbeat(); dirty=true; } })
    .catch(()=>{ mode='ls'; S=loadStore()||freshStore(); isLeader=true; heartbeat(); dirty=true; });
}

function loginAction(act){
  const app=local.app;
  if(act==='lg-demo-phone'){ setVal('lgPhone','9876543210'); login.err=''; return; }
  if(act==='lg-change'){ resetLogin(); return; }
  if(act==='lg-send'){
    const ph=(document.getElementById('lgPhone')?inVal('lgPhone'):login.phone).replace(/\D/g,'');
    if(!/^[6-9]\d{9}$/.test(ph)){ login.err='Enter a valid 10-digit Indian mobile number'; return; }
    login.phone=ph; login.otp=String(100000+Math.floor(Math.random()*900000)); login.tries=0; login.err=''; setVal('lgOtp',''); return;
  }
  if(act==='lg-verify'){
    const v=inVal('lgOtp').replace(/\D/g,'');
    if(v===login.otp){ auth.customer={id:fmtPhone(login.phone),at:Date.now()}; saveAuth(); resetLogin(); toast('Signed in as '+auth.customer.id); return; }
    login.tries++;
    if(login.tries>=3){ login.otp=null; login.err='Too many wrong codes. Request a new code.'; }
    else login.err='Wrong code. '+(3-login.tries)+' '+(3-login.tries===1?'try':'tries')+' left.';
    setVal('lgOtp',''); return;
  }
  if(act==='lg-fill'){ setVal('lgUser',STAFF[app].id); setVal('lgPass',DEMO_PASS); login.err=''; return; }
  if(act==='lg-staff'){
    const u=inVal('lgUser').trim().toUpperCase(), pw=inVal('lgPass');
    if(u!==STAFF[app].id||pw!==DEMO_PASS){ login.err='Staff ID or password is incorrect'; setVal('lgPass',''); return; }
    auth[app]={id:STAFF[app].id,at:Date.now()};
    if(app==='partner'){ local.shop=inVal('lgShop')||local.shop; auth.partner.shop=local.shop; auth.partner.id=STAFF.partner.id+' · '+partner(local.shop).name; }
    if(app==='rider'){ local.rider=inVal('lgRider')||local.rider; auth.rider.rider=local.rider; auth.rider.id=STAFF.rider.id+' · '+RIDERS.find(r=>r.id===local.rider).name; }
    saveAuth(); resetLogin(); toast('Signed in'); return;
  }
  if(act==='signout'){ delete auth[app]; saveAuth(); resetLogin(); toast('Signed out'); return; }
}

/* ===================== Helpers ===================== */
function fmt(min){ min=Math.max(0,min); const m=Math.floor(min), s=Math.floor((min-m)*60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function rs(n){ return '₹'+Math.round(n).toLocaleString('en-IN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function partner(id){ return PARTNERS.find(p=>p.id===id); }
function rider(id){ return RIDERS.find(r=>r.id===id); }
function stock(pid,med){ const s=(S.inv[pid]||{})[med]; return s?{qty:s[0],batch:s[1],exp:s[2]}:null; }
function okStock(pid,med,qty){ const s=stock(pid,med); return !!s && s.qty>=qty && s.exp>=3; }
function inService(p){ return p.km<=4 && S.online[p.id]; }
function acceptRate(pid){ const s=S.offerStats[pid]||{accepted:0,missed:0}; return (BASE_ACCEPT[pid]*20+s.accepted)/(20+s.accepted+s.missed); }
function totals(items){ const sub=items.reduce((a,it)=>a+MEDS[it.med].mrp*it.qty,0); const disc=Math.round(sub*0.10); const fee=(sub-disc>=499||sub===0)?0:29; return {sub,disc,fee,total:sub-disc+fee}; }
function rxKey(rx){ return !rx?null: rx.kind==='sample'?'S-'+rx.key:'U-'+rx.name+'-'+rx.size; }
function getOrder(id){ return S.orders.find(o=>o.id===id); }
function active(){ return S.orders.filter(o=>!o.done); }
function simNow(o){ if(o.done) return o.tEnd; const c=S.clock; return o.simBase + (c.paused?0:(Date.now()-o.realBase)/1000*c.speed/60); }
function rebase(at){ const now=at||Date.now(), c=S.clock; S.orders.forEach(o=>{ if(!o.done){ o.simBase=o.simBase+(c.paused?0:(now-o.realBase)/1000*c.speed/60); o.realBase=now; } }); }
function lastOffer(o){ return o.offers[o.offers.length-1]; }
function prog1(o){ return o.riderStage==='to_shop'? Math.min(1,(simNow(o)-o.assignedAt)/10) : (o.riderStage?1:0); }
function prog2(o){ return o.riderStage==='enroute'? (o.atDoor?1:Math.min(1,(simNow(o)-o.outAt)/18)) : (o.riderStage==='delivered'?1:0); }

/* ===================== Matching engine ===================== */
function altsFor(med){ const m=MEDS[med]; return Object.keys(MEDS).filter(k=>k!==med&&MEDS[k].salt===m.salt&&MEDS[k].strength===m.strength&&MEDS[k].form===m.form); }
function docSub(o){ return (o&&o.fields&&o.fields.docSub)||'allowed'; }
// Substitutes are considered only if the doctor permits them and nobody has turned them down for this order.
function orderOpts(o){ return {radius:o.radius||4, allowSub:!!(o.needsRx&&docSub(o)!=='no'&&!o.noSub&&!o.subApplied)}; }
function scorePartner(p, items, opt){
  opt=opt||{}; const R=opt.radius||4;
  const r={p, eligible:false, total:0, b:{basket:0,distance:0,accept:0,rating:0,shelf:0}, issues:[], subs:[]};
  if(p.km>R){ r.issues.push('Outside '+R+' km radius'); return r; }
  if(!S.online[p.id]){ r.issues.push('Shop offline'); return r; }
  let have=0, minShelf=99;
  items.forEach((it,i)=>{ const n=MEDS[it.med].brand;
    if(okStock(p.id,it.med,it.qty)){ have++; minShelf=Math.min(minShelf,stock(p.id,it.med).exp); return; }
    if(opt.allowSub&&MEDS[it.med].rx){ const alt=altsFor(it.med).find(k=>okStock(p.id,k,it.qty)); if(alt){ have++; r.subs.push({i,from:it.med,to:alt}); minShelf=Math.min(minShelf,stock(p.id,alt).exp); return; } }
    const s=stock(p.id,it.med); r.issues.push(!s||s.qty<it.qty?n+' not in stock':n+' expires in under 3 months'); });
  const frac=items.length?have/items.length:0;
  r.b.basket=40*frac; r.b.distance=25*Math.max(0,1-p.km/R); r.b.accept=15*acceptRate(p.id); r.b.rating=10*p.rating/5; r.b.shelf=have?10*Math.min(1,(minShelf-3)/9):0;
  r.total=Object.values(r.b).reduce((a,b)=>a+b,0); r.eligible=items.length>0&&frac===1; return r;
}
function rankPartners(items,opt){ return PARTNERS.map(p=>scorePartner(p,items,opt)).sort((a,b)=>(b.eligible-a.eligible)||(b.total-a.total)); }

/* ===================== Order lifecycle (operate on S inside mutate) ===================== */
function log(o, what, who, kind){ o.log.push({t:simNow(o), what, who, kind:kind||'ok'}); }
function setStatus(o, s, who, what, kind){ o.status=s; o.statusAt=simNow(o); if(what) log(o,what,who,kind); }
function finish(o, result){ o.tEnd=simNow(o); o.done=true; o.result=result; if(result==='delivered'&&o.rx) S.usedRx[rxKey(o.rx)]=o.id; }
function rxFields(rx){
  if(!rx) return null;
  if(rx.kind==='sample'){ const X=SAMPLES[rx.key]; return {doctor:X.doctor,reg:X.reg,date:X.date,patient:X.patient,match:false,docSub:X.sub==='no'?'no':'allowed',ixAck:false}; }
  return {doctor:'',reg:'',date:'',patient:'',match:false,docSub:'allowed',ixAck:false};
}
// The order is built on the customer's device and the same payload is applied by whoever writes the shared data.
function placeOrder(){
  const items=local.cart.map(c=>({med:c.med,qty:c.qty,orig:null,scanned:false}));
  const needsRx=items.some(it=>MEDS[it.med].rx);
  const p={id:'M60-'+String(Date.now()).slice(-5), otp:String(1000+Math.floor(Math.random()*9000)), createdMs:Date.now(), items, rx:needsRx?local.rxAttach:null,
    slot:local.slot||null, pay:local.pay||'UPI', allowSub:!!local.allowSub&&!(local.rxAttach&&local.rxAttach.kind==='sample'&&SAMPLES[local.rxAttach.key].sub==='no')};
  optimistic[p.id]=Date.now(); exec('place',p); return p.id;
}
function placeInto(p){
  if(getOrder(p.id)) return;
  const items=clone(p.items), needsRx=items.some(it=>MEDS[it.med].rx), rx=needsRx?p.rx:null, cod=p.pay==='COD';
  S.counter++;
  const o={id:p.id, epoch:S.epoch, createdMs:p.createdMs||Date.now(), items, needsRx, rx, fields:rxFields(rx), status:'CREATED', statusAt:0, simBase:0, realBase:Date.now(), log:[], offers:[], ranked:null,
    partnerId:null, riderId:null, riderStage:null, otp:p.otp, payMethod:p.pay||'UPI', payment:cod?'cod':'authorised', amount:totals(items).total, slot:p.slot||null, custAllowSub:!!p.allowSub, radius:4,
    subs:null, subApproved:false, partial:null, done:false, result:null};
  S.orders.push(o);
  log(o,'Order placed · '+rs(o.amount)+(cod?' · cash on delivery':' authorised on '+o.payMethod+' (not charged yet)')+(o.slot?' · scheduled for '+o.slot:' · express, within 60 min'),'Customer');
  if(rx&&rx.kind==='sample') log(o,'AI read the prescription · doctor’s substitution instruction: '+(o.fields.docSub==='no'?'do not substitute':'substitution permitted'),'System','sys');
  if(needsRx){ setStatus(o,'RX_UNDER_REVIEW','System','Prescription sent to the pharmacist queue','sys');
    log(o,'In parallel: '+rankPartners(items,orderOpts(o)).filter(r=>r.eligible).length+' of 5 nearby shops can supply the order','System','sys'); }
  else { log(o,'No prescription medicines · pharmacist check not needed','System','sys'); setStatus(o,'MATCHING','System','Matching nearby shops','sys'); }
}
function interactionsOf(items){ const salts=new Set(items.map(it=>MEDS[it.med].salt)); return INTERACTIONS.filter(x=>salts.has(x.a)&&salts.has(x.b)); }
function rxChecks(o){
  const f=o.fields, res=[];
  res.push(['Doctor name present', f.doctor.trim().length>3]);
  res.push(['Doctor registration number present', /[A-Za-z]{2,}.*\d{3,}/.test(f.reg)]);
  let ok=false; if(f.date){ const age=(Date.now()-new Date(f.date+'T00:00:00').getTime())/864e5; ok=age>=-1&&age<=183; }
  res.push(['Prescription dated within the last 6 months', ok]);
  res.push(['Patient is the account holder or a family member', PATIENTS.includes(f.patient)]);
  let match; if(o.rx.kind==='sample'){ const salts=SAMPLES[o.rx.key].items.map(i=>MEDS[i.med].salt); match=o.items.filter(it=>MEDS[it.med].rx).every(it=>salts.includes(MEDS[it.med].salt)); } else match=!!f.match;
  res.push(['Prescription medicines in the cart match the prescription', match]);
  const used=S.usedRx[rxKey(o.rx)];
  res.push([used?'Already dispensed against this prescription (order '+used+')':'First use of this prescription (image fingerprint)', !used]);
  const salts=o.items.map(it=>MEDS[it.med].salt);
  res.push(['No duplicate therapy (same salt twice)', new Set(salts).size===salts.length]);
  res.push(['No Schedule X or narcotic medicine', !o.items.some(it=>SCHEDULE_X.includes(it.med))]);
  const ix=interactionsOf(o.items);
  res.push([ix.length?'Interaction: '+ix.map(x=>x.a+' + '+x.b+' ('+x.note+')').join('; ')+(f.ixAck?' · reviewed':' · tick “reviewed” to clear'):'No known interactions between these medicines', !ix.length||!!f.ixAck]);
  res.push(['Doctor’s substitution instruction: '+(f.docSub==='no'?'NOT allowed (do not substitute)':'substitution permitted'), true]);
  return res;
}
function cancel(o, reason, who){
  if(o.done) return;
  const cap=o.payment==='captured', cod=o.payMethod==='COD'; o.payment=cap?'refunded':cod?'none':'released'; o.cancelReason=reason;
  if(o.partnerId && o.status==='PACKING'){ o.items.forEach(it=>{ const s=S.inv[o.partnerId][it.med]; if(s) s[0]+=it.qty; }); }
  setStatus(o,'CANCELLED',who,(reason?reason+' · ':'')+(cap?'payment refunded':cod?'cash on delivery, nothing to refund':'authorised payment released'),'bad'); finish(o,'cancelled');
}
function runMatching(o){
  const opt=orderOpts(o), R=opt.radius;
  o.ranked=rankPartners(o.items,opt).map(r=>({pid:r.p.id, eligible:r.eligible, total:r.total, b:r.b, issues:r.issues, subs:r.subs}));
  const next=o.ranked.filter(r=>r.eligible && !o.offers.some(x=>x.pid===r.pid));
  if(next.length){ const best=next[0];
    if(best.subs.length){ o.subs=best.subs; o.subPid=best.pid; o.subApproved=false;
      setStatus(o,'SUBSTITUTION_PENDING','System','Best shop '+partner(best.pid).name+' lacks '+best.subs.map(s=>MEDS[s.from].brand).join(', ')+' · doctor permits substitution, so a same-salt alternative is proposed','warn'); return; }
    log(o,o.ranked.filter(r=>r.eligible).length+' shops within '+R+' km can supply the full order · best: '+partner(best.pid).name+' ('+best.total.toFixed(1)+' pts)','System','sys'); offer(o,best.pid); return; }
  if(o.offers.length){ cancel(o,'No nearby pharmacy accepted the order','System'); return; }
  const near=PARTNERS.filter(p=>p.km<=R&&S.online[p.id]);
  const cov=near.map(p=>({p,keep:o.items.map((it,i)=>okStock(p.id,it.med,it.qty)?i:-1).filter(i=>i>=0)})).sort((a,b)=>(b.keep.length-a.keep.length)||(a.p.km-b.p.km))[0];
  const noSubNote=docSub(o)==='no'?' · doctor wrote “do not substitute”':'';
  if(cov&&cov.keep.length){ o.partial={pid:cov.p.id,keep:cov.keep}; setStatus(o,'PARTIAL_PENDING','System','No shop within '+R+' km has every item'+noSubNote+' · '+cov.p.name+' has '+cov.keep.length+' of '+o.items.length,'warn'); return; }

}
function offer(o,pid){ o.offers.push({pid,at:simNow(o),resp:null}); setStatus(o,'OFFERED_TO_PARTNER','System','Offered to '+partner(pid).name+' · 3-minute accept window','sys'); }
function bump(pid,k){ S.offerStats[pid]=S.offerStats[pid]||{accepted:0,missed:0}; S.offerStats[pid][k]++; }
function assignRider(o){
  if(o.riderId) return true;

  const p=partner(o.partnerId);
  const free=RIDERS.filter(r=>S.riderOnline[r.id]&&!busy.has(r.id)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
  if(!free){ if(!o.waitRiderLogged){ log(o,'No rider free right now · will assign as soon as one is online','System','warn'); o.waitRiderLogged=true; } return false; }
  o.riderId=free.id; o.riderStage='to_shop'; o.assignedAt=simNow(o);
  log(o,'Rider '+free.name+' assigned · heading to '+p.name+' while it packs','System','sys'); return true;
}
const ACT={
  approve(o){ if(o.status!=='RX_UNDER_REVIEW') return; if(rxChecks(o).some(c=>!c[1])){ toast('All checks must pass before approval'); return; }
    o.verifiedAt=simNow(o); setStatus(o,'RX_APPROVED','Pharmacist',PHARMACIST+' approved the prescription in '+fmt(simNow(o)));
    setStatus(o,'MATCHING','System','Matching engine ranking nearby shops','sys'); },
  reject(o,reasons){ if(o.status!=='RX_UNDER_REVIEW') return; if(!reasons.length){ toast('Pick at least one reason'); return; }
    o.rejectReasons=reasons; o.verifiedAt=simNow(o); setStatus(o,'RX_REJECTED','Pharmacist','Prescription rejected: '+reasons.join('; '),'bad'); cancel(o,null,'System'); },
  ask(o,a){ if(o.status!=='RX_UNDER_REVIEW') return; const q=String((a&&a.q)||'').trim()||'Please upload a clearer photo of the full prescription.';

/* System timers: only the leader tab runs them */
function systemTick(){
  if(!isLeader||mode==='pending') return;
  if(mode==='ls'){ const f=loadStore(); if(f) S=f; }
  if(mode==='db'&&(!metaLoaded||!ordersLoaded)) return;
  let changed=false;
  active().forEach(o=>{
    const t=simNow(o), since=t-o.statusAt; const before=o.log.length+o.status;
    if(o.status==='MATCHING'&&since>=0.3) runMatching(o);
    else if(o.status==='OFFERED_TO_PARTNER'&&!S.online[lastOffer(o).pid]){ const off=lastOffer(o); off.resp='declined'; log(o,partner(off.pid).name+' went offline · re-routing','System','warn'); setStatus(o,'MATCHING','System',null); runMatching(o); }
    else if(o.status==='OFFERED_TO_PARTNER'&&t-lastOffer(o).at>=3){ const off=lastOffer(o); off.resp='timeout'; bump(off.pid,'missed'); log(o,partner(off.pid).name+' did not respond in 3 min · re-routing','System','warn'); setStatus(o,'MATCHING','System',null); runMatching(o); }
    if((o.status==='PACKING'||o.status==='READY_FOR_PICKUP')&&!o.riderId) assignRider(o);
    if(o.riderStage==='to_shop'&&t>=o.assignedAt+10) ACT.arrive(o,null);
    if(o.status==='OUT_FOR_DELIVERY'&&!o.atDoor&&t>=o.outAt+18) ACT.door(o,null);
    if(o.log.length+o.status!==before) changed=true;
  });
  if(changed){ if(mode==='ls') persist(); else flushDiff(); dirty=true; }
}

const FRIENDLY={RX_QUERY:'The pharmacist has a question about your prescription',RX_APPROVED:'Prescription approved',SUBSTITUTION_PENDING:'A substitute needs your attention',PARTIAL_PENDING:'Some items are not available nearby',PARTNER_ACCEPTED:'A pharmacy confirmed your order',PACKING:'Your order is being packed',READY_FOR_PICKUP:'Packed and sealed',OUT_FOR_DELIVERY:'Out for delivery: keep your OTP ready',DELIVERED:'Delivered',CANCELLED:'Order cancelled'};
function notifyChanges(prev, next){
  const app=local.app; if(!app) return;
  next.orders.forEach(o=>{
    const p=prev.orders.find(x=>x.id===o.id);
    const changed=!p||p.status!==o.status||(p.subApproved!==o.subApproved)||(p.riderId!==o.riderId)||(p.offers.length!==o.offers.length);
    if(!changed) return;
    if(app==='pharmacist'){ if(o.status==='RX_UNDER_REVIEW'&&(!p||p.status!=='RX_UNDER_REVIEW')) toast('New prescription to verify: '+o.id); if(o.status==='SUBSTITUTION_PENDING'&&!o.subApproved&&(!p||p.status!=='SUBSTITUTION_PENDING')) toast('Substitution request: '+o.id); }
    if(app==='partner'){ const off=o.status==='OFFERED_TO_PARTNER'&&lastOffer(o); if(off&&off.pid===local.shop&&(!p||p.offers.length!==o.offers.length||p.status!=='OFFERED_TO_PARTNER')) toast('New order '+o.id+' · accept within 3 minutes'); }
    if(app==='rider'){ if(o.riderId===local.rider&&(!p||p.riderId!==o.riderId)) toast('New delivery assigned: '+o.id); if(o.riderId===local.rider&&o.status==='READY_FOR_PICKUP'&&p&&p.status!=='READY_FOR_PICKUP') toast(o.id+' is sealed and ready for pickup'); }
    if(app==='customer'){ if(p&&p.status!==o.status&&FRIENDLY[o.status]) toast(o.id+': '+FRIENDLY[o.status]); if(o.status==='SUBSTITUTION_PENDING'&&o.subApproved&&p&&!p.subApproved) toast('Please review the substitute for '+o.id); }
  });
}

function etaMin(o){
  const t=simNow(o), since=t-o.statusAt, rr=o.riderStage==='to_shop'?Math.max(0,o.assignedAt+10-t):(o.riderId?0:10);
  switch(o.status){
    case 'RX_UNDER_REVIEW': case 'RX_QUERY': return Math.max(1,7-since)+1.5+10+0.5+18;
    case 'RX_APPROVED': case 'MATCHING': case 'OFFERED_TO_PARTNER': case 'SUBSTITUTION_PENDING': case 'PARTIAL_PENDING': return 1.5+10+19;
    case 'PARTNER_ACCEPTED': case 'PACKING': return Math.max(Math.max(1,9-since),rr)+19;
    case 'READY_FOR_PICKUP': return rr+19;
    case 'PICKED_UP': return 18.5;
    case 'OUT_FOR_DELIVERY': return o.atDoor?0.5:Math.max(0,o.outAt+18-t)+0.5;
  }
  return 0;
}

function pharmChecks(o){
  const c=rxChecks(o), fails=c.filter(x=>!x[1]);
  return '<b>Checks</b><div class="list">'+c.map(x=>'<div class="row small"><span class="chip '+(x[1]?'ok':'bad')+'">'+(x[1]?'Pass':'Fail')+'</span><span>'+esc(x[0])+'</span></div>').join('')+'</div>'+
    '<b style="margin-top:6px">Reasons if rejecting</b><div class="list">'+[['Doctor registration number missing',!c[1][1]],['Prescription older than 6 months',!c[2][1]],['Patient not on this account',!c[3][1]],['Medicines do not match the prescription',!c[4][1]],['Prescription already used',!c[5][1]],['Image unclear or incomplete',!c[0][1]],['Risky interaction not cleared',!c[8][1]]].map((r,ri)=>'<label class="row small"><input type="checkbox" class="rej" id="rej-'+o.id+'-'+ri+'" data-keep="1" value="'+r[0]+'" '+(r[1]?'checked':'')+'> '+r[0]+'</label>').join('')+'</div>'+
    '<div class="row" style="flex-wrap:wrap;margin-top:6px"><button class="btn primary" data-a="ph-approve" data-id="'+o.id+'" '+(fails.length?'disabled':'')+'>Approve</button><button class="btn" data-a="ph-ask" data-id="'+o.id+'">Ask customer</button><button class="btn danger" data-a="ph-reject" data-id="'+o.id+'">Reject</button></div>'+
    '<label class="field" for="askQ-'+o.id+'">Question for the customer (sent with “Ask customer”; pauses the order clock)<input id="askQ-'+o.id+'" data-keep="1" value="Please upload a clearer photo showing the doctor’s registration number."></label>'+
    (fails.length?'<div class="small" style="color:var(--red)">'+fails.length+' check(s) failing. Correct the fields if the AI misread them, or reject.</div>':'<div class="small" style="color:var(--green)">All checks pass.</div>');
}
function viewPharmacist(){
  const queue=S.orders.filter(o=>o.status==='RX_UNDER_REVIEW'||(o.status==='SUBSTITUTION_PENDING'&&!o.subApproved));

  const sig=queue.map(q=>q.id).join(','); if(sig!==local.pharmSig){ if(local.pharmSig!=null&&queue.some(q=>!local.pharmSig.split(',').includes(q.id))) { local.pharmPinned=false; if(queue.length) local.pharmSel=queue[queue.length-1].id; } local.pharmSig=sig; }
  const o=local.pharmSel?getOrder(local.pharmSel):null;
  const done=S.orders.filter(x=>x.rx&&(x.verifiedAt!=null||x.status==='RX_QUERY')).slice().reverse();
  const left='<div class="card pad col"><span class="eyebrow">Waiting for you ('+queue.length+')</span>'+(queue.length?queue.map(q=>'<button class="item" data-a="ph-sel" data-id="'+q.id+'" style="cursor:pointer;text-align:left;width:100%;'+(q.id===local.pharmSel?'border-color:var(--accent)':'')+'"><span><span class="name">'+q.id+'</span><br><span class="small muted">'+(q.status==='RX_UNDER_REVIEW'?'Prescription · '+esc(q.fields.patient||'patient not set'):'Substitution request')+'</span></span><span class="mono small" data-tick="since" data-oid="'+q.id+'">'+fmt(simNow(q)-q.statusAt)+'</span></button>').join(''):'<div class="small muted">Nothing waiting. New prescriptions appear here instantly.</div>')+
    (done.length?'<span class="eyebrow" style="margin-top:8px">Decided earlier</span>'+done.map(d=>'<button class="item" data-a="ph-sel" data-id="'+d.id+'" style="cursor:pointer;text-align:left;width:100%"><span><span class="name">'+d.id+'</span><br><span class="small muted">'+esc(d.fields.patient||'')+'</span></span>'+(d.status==='RX_QUERY'?'<span class="chip warn">Asked customer</span>':d.rejectReasons?'<span class="chip bad">Rejected</span>':'<span class="chip ok">Approved</span>')+'</button>').join(''):'')+
    '<div class="small muted">Target: decide within 7 minutes.</div></div>';
  if(!o) return header('pharmacist')+'<main class="desk"><div class="grid-3">'+left+'<div class="card pad col"><h3>No prescription selected</h3><p class="muted" style="margin:0">When a customer orders prescription medicines, the order arrives here with the prescription and AI-extracted fields.</p></div><div></div></div></main>';
  let right='';
  if(o.status==='RX_UNDER_REVIEW'){
    const f=o.fields;
    right='<div class="card pad col"><b>Fields (AI-extracted, editable)</b>'+
      '<label class="field" for="f-doctor">Doctor<input id="f-doctor" data-field="doctor" data-id="'+o.id+'" value="'+esc(f.doctor)+'" placeholder="Doctor name as written"></label>'+
      '<label class="field" for="f-reg">Registration no.<input id="f-reg" data-field="reg" data-id="'+o.id+'" value="'+esc(f.reg)+'" placeholder="e.g. MMC-2011/04/1234"></label>'+
      '<label class="field" for="f-date">Prescription date<input id="f-date" type="date" data-field="date" data-id="'+o.id+'" value="'+esc(f.date)+'"></label>'+
      '<label class="field" for="f-patient">Patient<select id="f-patient" data-field="patient" data-id="'+o.id+'"><option value="">Select…</option>'+PATIENTS.map(p=>'<option '+(f.patient===p?'selected':'')+'>'+p+'</option>').join('')+'<option '+(f.patient==='Someone else'?'selected':'')+'>Someone else</option></select></label>'+

      (o.rx.kind==='upload'?'<label class="row small"><input type="checkbox" data-field="match" data-id="'+o.id+'" '+(f.match?'checked':'')+'> The medicines in the cart match this prescription</label>':'')+

  } else if(o.status==='RX_QUERY'){
    right='<div class="sheet col"><span class="chip warn" style="align-self:flex-start">Waiting for the customer</span><div>You asked: “'+esc(o.query||'')+'”</div><div class="small muted">The order clock is paused. It returns to your queue when the customer sends a new prescription.</div></div>';
  } else {
    right='<div class="card pad col"><div class="row"><span class="chip '+(o.rejectReasons?'bad':'ok')+'">'+(o.rejectReasons?'Rejected':'Verified')+'</span><span class="small">'+(o.verifiedAt!=null?'Decided at '+fmt(o.verifiedAt)+' after order':'')+'</span></div>'+(o.rejectReasons?'<div class="small">'+o.rejectReasons.map(esc).join('; ')+'</div>':'')+'<div class="small muted">Current status: '+statusChip(o)+'</div></div>';

/* ===================== Partner app ===================== */

  const mineDone=S.orders.filter(o=>o.partnerId===pid&&o.done);
  const missed=S.orders.filter(o=>o.offers.some(x=>x.pid===pid&&(x.resp==='timeout'||x.resp==='declined')));
  const tabs='<div class="seg"><button data-ptab="orders" aria-pressed="'+(local.shopTab==='orders')+'">Orders'+(mineOffers.length?' ('+mineOffers.length+' new)':'')+'</button><button data-ptab="inventory" aria-pressed="'+(local.shopTab==='inventory')+'">Inventory</button><button data-ptab="earnings" aria-pressed="'+(local.shopTab==='earnings')+'">Earnings</button></div>';
